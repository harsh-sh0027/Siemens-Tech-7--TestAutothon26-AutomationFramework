name: CI - Automation Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - all
      browser:
        description: "Browser for web run"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      run_mobile:
        description: "Also run mobile job"
        required: false
        default: false
        type: boolean
      include_live:
        description: "Include live locator dependent tests"
        required: false
        default: false
        type: boolean

jobs:
  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium firefox webkit

      - name: Resolve suite marker expression
        id: suite
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            suite="${{ inputs.suite }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            suite="regression"
          else
            suite="smoke"
          fi

          if [[ "$suite" == "all" ]]; then
            marker="web"
          else
            marker="web and $suite"
          fi

          include_live=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.include_live }}" == "true" ]]; then
            include_live=true
          fi

          if [[ "$include_live" != "true" ]]; then
            marker="$marker and not live"
          fi

          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      - name: Run web pytest
        env:
          IS_MOBILE: "false"
          HEADLESS: "true"
          BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chromium' }}
          GAJAB_BASE_URL: ${{ vars.GAJAB_BASE_URL || 'https://stg.gajab.com' }}
          TEST_MOBILE: ${{ vars.TEST_MOBILE || '9999999999' }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
        run: |
          pytest src/test/python/tests \
            -m "${{ steps.suite.outputs.marker }}"

      - name: Upload web artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts-${{ github.run_number }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30

  mobile-tests:
    name: Mobile tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_mobile == true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Appium
        run: |
          npm install -g appium@2
          appium driver install uiautomator2

      - name: Start Appium server
        shell: bash
        run: |
          appium --port 4723 > appium.log 2>&1 &
          sleep 8

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          IS_MOBILE: "true"
          APPIUM_HOST: "127.0.0.1"
          APPIUM_PORT: "4723"
          GAJAB_BASE_URL: ${{ vars.GAJAB_BASE_URL || 'https://stg.gajab.com' }}
          TEST_MOBILE: ${{ vars.TEST_MOBILE || '9999999999' }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            pytest src/test/python/tests -m "mobile and smoke and not live" --isMobile

      - name: Upload mobile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts-${{ github.run_number }}
          path: |
            reports/
            logs/
            appium.log
          if-no-files-found: warn
          retention-days: 30
